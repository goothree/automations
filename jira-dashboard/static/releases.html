<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira – Releases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #18181c;
      --border: #2a2a30;
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
      --accent: #a78bfa;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .layout {
      width: 100%;
      max-width: min(1500px, 98vw);
      margin: 0 auto;
      padding: clamp(1rem, 2vw, 2rem);
    }
    h1 {
      font-weight: 600;
      font-size: 1.75rem;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover { filter: brightness(1.1); }
    .btn-link {
      display: inline-block;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-link:hover { background: rgba(167, 139, 250, 0.15); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .releases-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .releases-table th,
    .releases-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .releases-table th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .releases-table th.sortable {
      cursor: pointer;
      user-select: none;
    }
    .releases-table th.sortable:hover { color: var(--accent); }
    .releases-table th .sort-indicator { margin-left: 0.25rem; font-size: 0.7rem; }
    .releases-table tr:last-child td { border-bottom: none; }
    .releases-table tbody tr:hover td { background: rgba(167, 139, 250, 0.05); }
    .release-name a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .release-name a:hover { text-decoration: underline; }
    .releases-table th.num,
    .releases-table td.num {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    .project-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      background: rgba(167, 139, 250, 0.2);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .loading, .error-msg, .empty-msg {
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
    }
    .error-msg {
      color: var(--error);
      background: rgba(248, 113, 113, 0.1);
      border-radius: 8px;
      margin: 1rem 0;
    }
    .count { color: var(--text-muted); font-size: 0.9rem; }
    .filters {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filters label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .multi-select { position: relative; }
    .multi-select-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      min-width: 8rem;
      max-width: 16rem;
      text-align: left;
    }
    .multi-select-menu {
      position: absolute;
      z-index: 40;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .filters .multi-select-menu label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.4rem;
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
    }
    .filters .multi-select-menu label:hover { background: rgba(167, 139, 250, 0.12); }
    .multi-select-menu input { accent-color: var(--accent); }
    .filters input[type="date"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .filters input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
    }
  </style>
</head>
<body>
  <div class="layout">
    <h1>Releases</h1>
    <p class="subtitle">Unreleased versions from IDA and RDAR, ordered by release date (newest first)</p>

    <div class="toolbar">
      <button type="button" id="btnRefresh" onclick="loadReleases()">Refresh</button>
      <a href="/" class="btn-link">Team Dashboard</a>
      <a href="/calendar" class="btn-link">Test Calendar</a>
      <div class="filters">
        <label>Project</label>
        <div class="multi-select" id="filterProject">
          <button type="button" class="multi-select-toggle" aria-expanded="false">All</button>
          <div class="multi-select-menu" hidden>
            <label><input type="checkbox" value="IDA"> IDA</label>
            <label><input type="checkbox" value="RDAR"> RDAR</label>
          </div>
        </div>
        <label for="filterDateFrom">From</label>
        <input type="date" id="filterDateFrom" />
        <label for="filterDateTo">To</label>
        <input type="date" id="filterDateTo" />
      </div>
      <span class="count" id="count"></span>
    </div>

    <div id="content">
      <div class="loading" id="loading">Loading…</div>
      <div class="error-msg" id="error" style="display: none;"></div>
      <div class="card" id="card" style="display: none;">
        <table class="releases-table">
          <thead>
            <tr>
              <th class="sortable" data-sort="project" onclick="setSort('project')">Project <span class="sort-indicator"></span></th>
              <th class="sortable" data-sort="name" onclick="setSort('name')">Release Name <span class="sort-indicator"></span></th>
              <th class="sortable" data-sort="release_date" onclick="setSort('release_date')">Release Date <span class="sort-indicator"></span></th>
              <th class="sortable num" data-sort="total" onclick="setSort('total')">Total <span class="sort-indicator"></span></th>
              <th class="sortable num" data-sort="qa" onclick="setSort('qa')">QA <span class="sort-indicator"></span></th>
              <th class="sortable num" data-sort="in_work" onclick="setSort('in_work')">In Work <span class="sort-indicator"></span></th>
              <th class="sortable num" data-sort="backlog" onclick="setSort('backlog')">Backlog <span class="sort-indicator"></span></th>
              <th class="sortable num" data-sort="blocked" onclick="setSort('blocked')">Blocked <span class="sort-indicator"></span></th>
              <th style="width: 120px;">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty-msg" id="empty" style="display: none;">No releases match the current filters.</div>
    </div>
  </div>

  <script>
    var allReleases = [];
    var initialReleasesLoadDone = false;
    var sortBy = 'release_date';
    var sortDir = 'desc';

    function setSort(col) {
      if (sortBy === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortBy = col; sortDir = col === 'release_date' ? 'desc' : 'asc'; }
      updateSortIndicators();
      updateView();
    }

    function updateSortIndicators() {
      document.querySelectorAll('.releases-table th.sortable').forEach(function(th) {
        var ind = th.querySelector('.sort-indicator');
        if (!ind) return;
        var col = th.getAttribute('data-sort');
        ind.textContent = (sortBy === col) ? (sortDir === 'asc' ? '\u25b2' : '\u25bc') : '';
      });
    }

    function numericSortValue(release, key) {
      var value = release[key];
      if (value == null && key === 'total' && release.issue_count != null) {
        value = release.issue_count;
      }
      return value == null ? null : Number(value);
    }

    function compareReleases(a, b, key) {
      if (key === 'release_date') {
        var dateA = a.release_date || '';
        var dateB = b.release_date || '';
        if (dateA && dateB) {
          if (dateA !== dateB) return dateA.localeCompare(dateB);
          return a.name.localeCompare(b.name);
        }
        if (dateA) return -1;
        if (dateB) return 1;
        return a.name.localeCompare(b.name);
      }

      if (key === 'total' || key === 'qa' || key === 'in_work' || key === 'backlog' || key === 'blocked') {
        var numA = numericSortValue(a, key);
        var numB = numericSortValue(b, key);
        if (numA == null && numB == null) return a.name.localeCompare(b.name);
        if (numA == null) return 1;
        if (numB == null) return -1;
        if (numA !== numB) return numA - numB;
        return a.name.localeCompare(b.name);
      }

      var valA = String(a[key] || '').toLowerCase();
      var valB = String(b[key] || '').toLowerCase();
      if (valA !== valB) return valA.localeCompare(valB);
      return a.name.localeCompare(b.name);
    }

    function sortReleases(releases) {
      if (!sortBy) return releases;
      var dir = sortDir === 'asc' ? 1 : -1;
      return releases.slice().sort(function(a, b) {
        var cmp = compareReleases(a, b, sortBy);
        if (cmp !== 0) return cmp * dir;
        return a.name.localeCompare(b.name);
      });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function formatReleaseDate(value) {
      if (!value) return 'TBD';
      var parts = String(value).split('-');
      if (parts.length !== 3) return value;
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(date.getTime())) return value;
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function parseReleaseDate(value) {
      if (!value) return null;
      var parts = String(value).split('-');
      if (parts.length !== 3) return null;
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return isNaN(date.getTime()) ? null : date;
    }

    function parseInputDate(value) {
      if (!value) return null;
      var parts = String(value).split('-');
      if (parts.length !== 3) return null;
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return isNaN(date.getTime()) ? null : date;
    }

    function filterList(value) {
      if (Array.isArray(value)) return value.map(String).filter(Boolean);
      if (value) return [String(value)];
      return [];
    }

    function selectedProjects() {
      return [...document.querySelectorAll('#filterProject input[type="checkbox"]:checked')].map(function(input) {
        return input.value;
      });
    }

    function updateProjectLabel() {
      var button = document.querySelector('#filterProject .multi-select-toggle');
      var labels = selectedProjects();
      button.textContent = labels.length ? labels.join(', ') : 'All';
      button.title = button.textContent;
    }

    function getFilteredReleases() {
      var projects = selectedProjects();
      var dateFrom = parseInputDate(document.getElementById('filterDateFrom').value);
      var dateTo = parseInputDate(document.getElementById('filterDateTo').value);

      return sortReleases(allReleases.filter(function(release) {
        if (projects.length && projects.indexOf(release.project) === -1) return false;

        var releaseDate = parseReleaseDate(release.release_date);
        if (dateFrom || dateTo) {
          if (!releaseDate) return false;
          if (dateFrom && releaseDate < dateFrom) return false;
          if (dateTo && releaseDate > dateTo) return false;
        }

        return true;
      }));
    }

    function updateView() {
      var card = document.getElementById('card');
      var empty = document.getElementById('empty');
      var count = document.getElementById('count');
      var releases = getFilteredReleases();

      count.textContent = releases.length + ' of ' + allReleases.length + ' unreleased';

      if (!releases.length) {
        card.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      renderTable(releases);
      updateSortIndicators();
      card.style.display = 'block';
      empty.style.display = 'none';
    }

    function dashboardUrlForRelease(release) {
      var params = new URLSearchParams();
      params.set('project', release.project);
      params.set('release', release.name);
      return '/?' + params.toString();
    }

    function formatCount(value) {
      return value == null ? '—' : String(value);
    }

    function renderTable(releases) {
      var tbody = document.getElementById('tbody');
      tbody.innerHTML = releases.map(function(release) {
        var nameHtml = '<a href="' + escapeHtml(dashboardUrlForRelease(release)) + '">' + escapeHtml(release.name) + '</a>';
        var jiraHtml = release.link
          ? '<a class="btn-link" href="' + escapeHtml(release.link) + '" target="_blank" rel="noopener">Open in Jira</a>'
          : '—';
        return '<tr>'
          + '<td><span class="project-badge">' + escapeHtml(release.project) + '</span></td>'
          + '<td class="release-name">' + nameHtml + '</td>'
          + '<td>' + escapeHtml(formatReleaseDate(release.release_date)) + '</td>'
          + '<td class="num">' + escapeHtml(formatCount(release.total != null ? release.total : release.issue_count)) + '</td>'
          + '<td class="num">' + escapeHtml(formatCount(release.qa)) + '</td>'
          + '<td class="num">' + escapeHtml(formatCount(release.in_work)) + '</td>'
          + '<td class="num">' + escapeHtml(formatCount(release.backlog)) + '</td>'
          + '<td class="num">' + escapeHtml(formatCount(release.blocked)) + '</td>'
          + '<td>' + jiraHtml + '</td>'
          + '</tr>';
      }).join('');
    }

    function getReleaseFilterState() {
      return {
        project: selectedProjects(),
        dateFrom: document.getElementById('filterDateFrom').value,
        dateTo: document.getElementById('filterDateTo').value,
      };
    }

    function restoreReleaseFilterState(state) {
      if (!state) return;
      var selected = new Set(filterList(state.project));
      document.querySelectorAll('#filterProject input[type="checkbox"]').forEach(function(input) {
        input.checked = selected.has(input.value);
      });
      updateProjectLabel();
      document.getElementById('filterDateFrom').value = state.dateFrom || '';
      document.getElementById('filterDateTo').value = state.dateTo || '';
    }

    var RELEASE_FILTERS_KEY = 'jira-dashboard-release-filters';

    function readReleaseFilters() {
      try {
        var raw = sessionStorage.getItem(RELEASE_FILTERS_KEY);
        if (!raw) return null;
        var state = JSON.parse(raw);
        return state && typeof state === 'object' ? state : null;
      } catch (e) {
        return null;
      }
    }

    function saveReleaseFilters() {
      try {
        sessionStorage.setItem(RELEASE_FILTERS_KEY, JSON.stringify(getReleaseFilterState()));
      } catch (e) {}
    }

    function onReleaseFilterChange() {
      updateProjectLabel();
      saveReleaseFilters();
      updateView();
    }

    function bindProjectFilter() {
      var root = document.getElementById('filterProject');
      var button = root.querySelector('.multi-select-toggle');
      var menu = root.querySelector('.multi-select-menu');
      button.addEventListener('click', function(event) {
        event.stopPropagation();
        var willOpen = menu.hidden;
        menu.hidden = !willOpen;
        button.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });
      menu.addEventListener('change', onReleaseFilterChange);
      menu.addEventListener('click', function(event) { event.stopPropagation(); });
      document.addEventListener('click', function() {
        menu.hidden = true;
        button.setAttribute('aria-expanded', 'false');
      });
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          menu.hidden = true;
          button.setAttribute('aria-expanded', 'false');
        }
      });
    }

    function loadReleases() {
      var savedFilters = initialReleasesLoadDone ? getReleaseFilterState() : null;
      var savedSortBy = sortBy;
      var savedSortDir = sortDir;
      var loading = document.getElementById('loading');
      var error = document.getElementById('error');
      var card = document.getElementById('card');
      var empty = document.getElementById('empty');
      var count = document.getElementById('count');

      loading.style.display = 'block';
      error.style.display = 'none';
      card.style.display = 'none';
      empty.style.display = 'none';
      count.textContent = '';

      fetch('/api/releases')
        .then(function(response) { return response.json().then(function(data) { return { ok: response.ok, data: data }; }); })
        .then(function(result) {
          loading.style.display = 'none';
          if (!result.ok || result.data.error) {
            error.textContent = result.data.error || 'Failed to load releases.';
            error.style.display = 'block';
            return;
          }
          allReleases = result.data.releases || [];
          if (savedFilters) restoreReleaseFilterState(savedFilters);
          else restoreReleaseFilterState(readReleaseFilters());
          sortBy = savedSortBy;
          sortDir = savedSortDir;
          initialReleasesLoadDone = true;
          if (!allReleases.length) {
            count.textContent = '0 unreleased';
            empty.textContent = 'No unreleased versions found in IDA or RDAR.';
            empty.style.display = 'block';
            return;
          }
          updateView();
        })
        .catch(function(err) {
          loading.style.display = 'none';
          error.textContent = 'Failed to load releases: ' + err.message;
          error.style.display = 'block';
        });
    }

    bindProjectFilter();
    document.getElementById('filterDateFrom').onchange = onReleaseFilterChange;
    document.getElementById('filterDateTo').onchange = onReleaseFilterChange;

    loadReleases();
  </script>
</body>
</html>
