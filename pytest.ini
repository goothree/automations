[pytest]
testpaths = src/tests
python_files = test_*.py
addopts = -v -s --tb=short
markers =
    smoke: mark test as smoke test
    regression: mark test as regression test
    ida_5376: IDA-5376 auth resilience during Virtual Monitoring
    p1: priority 1 acceptance criteria for IDA-5376
    p2: priority 2 edge cases for IDA-5376